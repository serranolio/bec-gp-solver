# base.toml
# Fixed physical parameters shared across all simulations in a sweep.
# The sweep script copies this file and adds/overrides the [sweep] section.
# All frequencies in Hz, times in ms, lengths in recoil units.

# =============================================================================
# Physical constants
# =============================================================================
[constants]
m_ua     = 86.909187
hbar_si  = 1.054571800139113e-34
a_si     = 5.2917721067e-11
f_recoil = 1960.0            # Hz

# =============================================================================
# System
# =============================================================================
[system]
n_atoms      = 193369.0
n_components = 3
sigma_z      = [-1.0, 1.0, 3.0]
q_zeeman_hz  = [0.0, 0.0, 7189.099499024451]  # Hz

# scattering length matrix in units of a_si
a_matrix = [
    [100.40, 100.41, 101.32],
    [100.41, 100.86, 100.40],
    [101.32, 100.40, 100.40],
]

# =============================================================================
# Trap
# =============================================================================
[trap]
fx = 176.22        # Hz
fy = 198.53        # Hz
fz = 27.99         # Hz
homogeneous = false # if true, trap potential is set to zero

# =============================================================================
# Spin-orbit coupling
# =============================================================================
[spin_orbit]
omega_r = 2.7

# =============================================================================
# Geometry
# =============================================================================
[geometry]
kind         = "3d_axial"
nx           = 64
ny           = 0            # unused for 3d_axial and 2d_cart
nz           = 512
lx_rx_factor = 1.5
ly_ry_factor = 0.0          # unused for 3d_axial and 2d_cart
lz_rz_factor = 2.5

# =============================================================================
# Ground state cooling (imaginary time)
# =============================================================================
[ground_state]
steps     = 50000
step_size = 0.02      # RK4 step for imaginary time (recoil units), checked against stability

# Initial guess for imaginary-time cooling (both optional).
# initial_weights: per-component weights broadcast onto the Thomas-Fermi
#   profile psi0 -> component k is seeded with initial_weights[k] * psi0.
#   Length must equal system.n_components. Defaults to all ones ([psi0, psi0, ...]).
# modulation: if true, imprint a plane-wave phase e^{-i k_l z} on component 0
#   and e^{+i k_l z} on component 1 (stripe-like guess). Defaults to false.
# initial_weights = [1.0, 1.0, 0.0]
# modulation      = false

# =============================================================================
# Real-time simulation
# =============================================================================
[simulation]
mode        = "gpe"   # "gpe", "pgpe" (projected onto the c-field, needs [projector].e_cut)
                      # or "spgpe" (PGPE + thermal reservoir, also needs [reservoir])
t_frames    = 201     # number of output frames
# dt        = 0.02    # optional RK4IP step (recoil units); default: the smaller of
                      # 0.5 × stability limit and the step keeping RK4 damping < 1%
twa_noise   = false   # add TWA quantum noise to initial state
# seed      = 12345   # optional: reproducible noise, stream seeded by [seed, sample]

# Which observables to save — add/remove entries as needed.
# Supported: "polarization", "populations", "wavefunction", "momentum_density"
observables = ["wavefunction"]

# =============================================================================
# c-field projector (used for TWA noise and mode = "pgpe"/"spgpe")
# =============================================================================
# Modes with k_perp² + (k_z - sigma_z)² < e_cut (recoil energies) form the
# c-field region; TWA noise puts half a quantum in each of them.
# e_cut is required when twa_noise = true or mode = "pgpe"/"spgpe". A warning is logged if the region
# aliases the nonlinear term (extends beyond k_max/2) or if the number of
# modes is not small compared with n_atoms.
[projector]
e_cut = 1.35          # no alias-free cutoff exists here: the sigma_z = 3 minimum
                      # (k_z = 3) lies beyond k_max/2 = 2.15, so a warning is logged

# =============================================================================
# Thermal reservoir (used only for mode = "spgpe"; fixed during the ramp)
# =============================================================================
# Number damping γ_j, energy damping ℳ_j and particle exchange ℳ_jk are
# computed from temperature_nk, mu_hz, [projector].e_cut and a_matrix
# (Bradley & Blakie 2014); the run log prints them. They are exponentially
# small when e_cut - mu >> k_B T. Optional overrides: gamma, energy_damping
# (scalar or per component), exchange_damping (scalar or symmetric matrix).
# mu uses the same energy zero as the Hamiltonian, where the bare band minima
# (k_z = sigma_z) are at 0; an imaginary-time run logs the ground-state mu.
# [reservoir]
# temperature_nk = 100.0    # reservoir temperature
# mu_hz          = 2440.0   # reservoir chemical potential
# equilibrate_ms = 5.0      # optional: SPGPE hold at the t = 0 parameters before the ramp

# =============================================================================
# Sweep parameters (overridden per job by generate_sweep.py)
# =============================================================================
[sweep]
sample         = 0
ramp_time_ms   = 50.0
total_time_ms  = 100.0
delta_start_hz = 5000.0
delta_end_hz   = -1500.0
omega_l_start  = 0.2
omega_l_end    = 0.2
