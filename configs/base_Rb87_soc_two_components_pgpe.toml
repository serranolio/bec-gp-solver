# base_Rb87_soc_two_components_pgpe.toml
# Fixed physical parameters shared across all simulations in a sweep.
# The sweep script copies this file and adds/overrides the [sweep] section.
# All frequencies in Hz, times in ms, lengths in recoil units.

# =============================================================================
# Physical constants
# =============================================================================
[constants]
m_ua     = 86.909187
hbar_si  = 1.054571800139113e-34
a_si     = 5.2917721067e-11
f_recoil = 1960.0            # Hz

# =============================================================================
# System
# =============================================================================
[system]
n_atoms      = 193369.0
n_components = 2
sigma_z      = [-1.0, 1.0]
q_zeeman_hz  = [0.0, 0.0]  # Hz

# scattering length matrix in units of a_si
#a_matrix = [
#    [100.40, 100.41],
#    [100.41, 100.86],
#]

a_matrix = [
    [100.40, 100.40],
    [100.40, 100.40]
]

# =============================================================================
# Trap
# =============================================================================
[trap]
fx = 176.22   # Hz
fy = 198.53   # Hz
fz = 27.99    # Hz

# =============================================================================
# Spin-orbit coupling
# =============================================================================
[spin_orbit]
omega_r = 2.7

# =============================================================================
# Geometry
# =============================================================================
[geometry]
kind         = "3d_axial"
nx           = 64
ny           = 0            # unused for 3d_axial and 2d_cart
nz           = 512
lx_rx_factor = 1.5
ly_ry_factor = 0.0          # unused for 3d_axial and 2d_cart
lz_rz_factor = 2.5

# =============================================================================
# Ground state cooling (imaginary time)
# =============================================================================
[ground_state]
steps     = 50000
step_size = 0.02      # recoil units

# =============================================================================
# Real-time simulation
# =============================================================================
[simulation]
mode        = "pgpe"  # "gpe" or "pgpe" (projected onto the c-field, needs [projector].e_cut)
t_frames    = 201     # number of output frames
twa_noise   = true   # add TWA quantum noise to initial state

# Which observables to save — add/remove entries as needed.
# Supported: "polarization", "populations", "wavefunction", "momentum_density"
observables = ["wavefunction"]

# =============================================================================
# c-field projector (used for TWA noise and mode = "pgpe")
# =============================================================================
# Modes with k_perp² + (k_z - sigma_z)² < e_cut (recoil energies) form the
# c-field region; TWA noise puts half a quantum in each of them.
# e_cut is required when twa_noise = true or mode = "pgpe". A warning is logged if the region
# aliases the nonlinear term (extends beyond k_max/2) or if the number of
# modes is not small compared with n_atoms.
[projector]
e_cut = 1.32          # alias-free on this grid (nx=64, nz=512) for omega_r in [1, 3.9];
                      # the largest alias-free value is 1.32-1.46 depending on omega_r

# =============================================================================
# Sweep parameters (overridden per job by generate_sweep.py)
# =============================================================================
[sweep]
sample         = 1
ramp_time_ms   = 0.0
total_time_ms  = 20.0
delta_start_hz = 0.0
delta_end_hz   = 0.0
omega_l_start  = 0.9
omega_l_end    = 0.1
