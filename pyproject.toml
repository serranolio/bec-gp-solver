[project]
authors = [{name = "serranolio", email = "serranolio@gmail.com"}]
dependencies = ["discrete-hankel-transform>=0.1.0,<0.2"]
name = "bec-gp-solver"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
bec_gp_solver = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.4.2,<3"
scipy = ">=1.17.0,<2"
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"
